name: orchestrator-ci

on:
  pull_request:
  push:
    branches:
      - orchestrator/v3-mvp

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock-vitest-4.1.11
          path: package-lock.json
          if-no-files-found: error
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli/main.js version
      - run: npm run e2e
